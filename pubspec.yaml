name: win_pos
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 3.1.0+15

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.0.0
  ffi: ^2.0.0
  get: ^4.6.6
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_slidable: ^3.1.2
  intl: ^0.19.0
  dropdown_search: ^5.0.6
  file_picker: ^8.1.3
  permission_handler: ^11.3.1
  printing: ^5.13.4
  pdf: ^3.11.3
  shared_preferences: ^2.5.3
  animate_do: ^4.2.0
  pull_to_refresh: ^2.0.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6
  device_info_plus: ^11.1.0
  omni_datetime_picker: ^2.3.1
  googleai_dart: ^11.0.0
  image: ^4.0.17
  flutter_gen_ai_chat_ui: ^2.15.0
  flutter_dotenv: ^6.0.1
  fluttertoast: ^9.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/winpos.db
    - assets/images/shop_logo.png
    - assets/fonts/NotoSansMyanmar-Regular.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - .env
  fonts:
     - family: NotoSans
       fonts:
         - asset: assets/fonts/NotoSans-Regular.ttf
